syntax = "proto3";

import "phoenix/protobuf/decimal.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Tgs.GameInterface.WicketCricket.Protos";

package gameinterfacewicketcricket;

// The greeting service definition.
service GameInterfaceWicketCricket {
  // Sends a greeting
  rpc PlayerBalance (PlayerBalanceRequest) returns (PlayerBalanceReply);
  rpc PlayerCreate (PlayerCreateRequest) returns (BaseReply);
  rpc PlayerLogout (PlayerLogoutRequest) returns (BaseReply);
  rpc FundOut(FundRequest) returns (FundReply);
  rpc FundIn (FundRequest) returns (FundReply);
  rpc FundStatus(FundStatusRequest) returns (BaseReply);
  rpc GameUrl (GameUrlRequest) returns (GameUrlReply);
  rpc GameWagerSettled (GameWagerSettledRequest) returns (GameWagerReply);
  rpc GameWagerUnsettled (GameWagerUnsettledRequest) returns (GameWagerReply);
  rpc CheckingService(CheckingServiceRequest) returns (CheckingServiceReply);
}

// The request message containing the user's name.
message PlayerBalanceRequest {
    string api_url = 1;
	string website = 2;
	string cert = 3;
    string player_code = 4;
}

message PlayerCreateRequest {
    string exchange_api_url = 1;
	string website = 2;
	string cert = 3;
	string agent = 4;
    string player_code = 5;
	int32 currency = 6;
}

message PlayerLogoutRequest {
    string exchange_api_url = 1;
	string website = 2;
	string cert = 3;
    string player_code = 4;
}

message FundRequest {
    string api_url = 1;
	string website = 2;
	string cert = 3;
    string player_code = 4;
	string txid = 5;
	phoenix.protobuf.DecimalValue amount = 6;
}

message FundStatusRequest {
    string api_url = 1;
	string website = 2;
	string cert = 3;
    string player_code = 4;
	string txid = 5;
}

message GameUrlRequest {
    string exchange_api_url = 1;
	string website = 2;
	string cert = 3;
	string agent = 4;
    string player_code = 5;
	int32 currency = 6;
}

message GameWagerSettledRequest {
    string api_url = 1;
	string website = 2;
	string cert = 3;
	google.protobuf.Timestamp start_time = 4; 
	google.protobuf.Timestamp end_time = 5;
	ReportTypes report_type = 6;
	int32 page_number = 7;

}

message GameWagerUnsettledRequest {
    string api_url = 1;
	string website = 2;
	string cert = 3;
	google.protobuf.Timestamp last_update_time = 4; 
	ReportTypes report_type = 5;
	int32 page_number = 6;
}

message CheckingServiceRequest{
    string machine_name = 1;
}

// The response message containing the greetings.
message BaseReply{
	bool status = 1;
}

message PlayerBalanceReply {
	bool is_player_exist = 1;
	phoenix.protobuf.DecimalValue balance = 2;
    phoenix.protobuf.DecimalValue free_balance = 3;
    phoenix.protobuf.DecimalValue outstanding_balance = 4;
}

message FundReply {
	string resp = 1;
}

message GameUrlReply {
	string game_url = 1;
}

message GameWagerReply {
	repeated GameWagerInfo items = 1;
}

message GameWagerInfo {
	string player_code = 1;
	string external_round_id = 2;
	string external_wager_id = 3;
    string external_game_id = 4;
	bool is_closed = 5;
	bool is_cancelled = 6;
	bool is_voided = 7;
	google.protobuf.Timestamp external_created_on = 8;
	google.protobuf.Timestamp external_closed_on = 9;
	phoenix.protobuf.DecimalValue bet = 10;
	phoenix.protobuf.DecimalValue settle = 11;
	phoenix.protobuf.DecimalValue win_loss = 12;	
	string additional_data = 13;
}

message CheckingServiceReply{
    string machine_name = 1;
}

enum ReportTypes{
	REPORT_TYPES_EXCHANGE = 0;
    REPORT_TYPES_SPORTSBOOK = 2;
    REPORT_TYPES_BOOKMAKER = 3;
    REPORT_TYPES_FANCY_BET = 7;
}